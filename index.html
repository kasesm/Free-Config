<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کانفیگ رایگان</title>
    <link rel="icon" type="image/jpeg" href="icon.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
        body { background-color: #0d1117; color: white; font-family: 'Vazirmatn', sans-serif; }
        .glass { background: rgba(22, 27, 34, 0.8); border: 1px solid rgba(59, 130, 246, 0.1); transition: 0.3s; }
        .glass:hover { border-color: #3b82f6; transform: translateY(-3px); }
    </style>
</head>
<body class="flex flex-col items-center p-6 min-h-screen">
    <header class="text-center mt-12 mb-10">
        <h1 class="text-5xl font-black bg-gradient-to-r from-blue-500 to-cyan-400 bg-clip-text text-transparent">کانفیگ رایگان</h1>
        <div class="flex items-center justify-center gap-2 mt-4 text-green-500 text-sm">
            <span class="relative flex h-2 w-2"><span class="animate-ping absolute h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative h-2 w-2 rounded-full bg-green-500"></span></span>
            وضعیت سیستم: فعال | بروزرسانی: <span id="last-update">...</span>
        </div>
    </header>

    <main class="w-full max-w-xl space-y-4">
        <div onclick="copyLink('all_sub.txt')" class="glass rounded-2xl p-5 flex items-center justify-between cursor-pointer">
            <span id="count-all" class="text-blue-400 text-sm bg-blue-500/10 px-2 py-1 rounded-lg">...</span>
            <div class="flex items-center gap-4 font-bold text-lg">میکس همه کانفیگ‌ها <i class="fas fa-layer-group text-blue-500"></i></div>
        </div>
        <div onclick="copyLink('vless_sub.txt')" class="glass rounded-2xl p-5 flex items-center justify-between cursor-pointer">
            <span id="count-vless" class="text-green-400 text-sm bg-green-500/10 px-2 py-1 rounded-lg">...</span>
            <div class="flex items-center gap-4 font-bold text-lg text-green-100">پروتکل VLESS <i class="fas fa-shield-halved text-green-500"></i></div>
        </div>
    </main>

    <footer class="mt-16 flex gap-6">
        <a href="https://t.me/YOUR_ID" class="text-gray-400 hover:text-blue-400 text-2xl"><i class="fab fa-telegram"></i></a>
        <a href="https://instagram.com/YOUR_ID" class="text-gray-400 hover:text-pink-500 text-2xl"><i class="fab fa-instagram"></i></a>
    </footer>

    <div onclick="toggleModal()" class="fixed bottom-6 right-6 bg-blue-600 w-12 h-12 rounded-full flex items-center justify-center cursor-pointer shadow-lg z-50"><i class="fas fa-question"></i></div>

    <script>
        fetch('info.json').then(r => r.json()).then(data => {
            document.getElementById('count-all').innerText = data.all + " کانفیگ";
            document.getElementById('count-vless').innerText = data.vless + " کانفیگ";
            document.getElementById('last-update').innerText = data.last_update;
        });
        function copyLink(f) {
            const url = `https://raw.githubusercontent.com/${window.location.pathname.split('/')[1]}/${window.location.pathname.split('/')[2]}/main/${f}`;
            navigator.clipboard.writeText(url); alert("لینک کپی شد!");
        }
        function toggleModal() { alert("راهنما: لینک را کپی کرده و در برنامه v2rayNG در بخش Subscription Group وارد کنید."); }
    </script>
</body>
</html>
