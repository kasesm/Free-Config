<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل کانفیگ رایگان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
        body { 
            background-color: #0d1117; 
            color: white; 
            font-family: 'Vazirmatn', sans-serif; 
        }
        .config-box {
            background: rgba(22, 27, 34, 0.8);
            border: 2px solid rgba(59, 130, 246, 0.1);
            transition: all 0.3s ease;
        }
        .config-box:hover { 
            border-color: #3b82f6; 
            transform: scale(1.02);
            background: rgba(30, 41, 59, 1);
        }
        .social-card {
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .social-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-6">

    <header class="text-center mt-10 mb-12">
        <h1 class="text-5xl md:text-6xl font-black mb-4 bg-gradient-to-r from-blue-500 to-cyan-400 bg-clip-text text-transparent">
            کانفیگ رایگان
        </h1>
        <p class="text-gray-400">بروزرسانی خودکار هر چند ساعت یکبار</p>
    </header>

    <main class="w-full max-w-xl space-y-4">
        
        <div onclick="copyLink('all_sub.txt')" class="config-box rounded-2xl p-5 flex items-center justify-between cursor-pointer">
            <span class="text-gray-600 text-2xl">+</span>
            <div class="flex items-center gap-4">
                <span class="font-bold text-lg">میکس همه کانفیگ‌ها</span>
                <div class="bg-blue-500/20 p-3 rounded-xl text-blue-500"><i class="fas fa-layer-group fa-lg"></i></div>
            </div>
        </div>

        <div onclick="copyLink('vless_sub.txt')" class="config-box rounded-2xl p-5 flex items-center justify-between cursor-pointer border-green-900/30">
            <span class="text-gray-600 text-2xl">+</span>
            <div class="flex items-center gap-4">
                <span class="font-bold text-lg text-green-100">پروتکل VLESS</span>
                <div class="bg-green-500/20 p-3 rounded-xl text-green-500"><i class="fas fa-shield-halved fa-lg"></i></div>
            </div>
        </div>

        <div onclick="copyLink('vmess_sub.txt')" class="config-box rounded-2xl p-5 flex items-center justify-between cursor-pointer border-purple-900/30">
            <span class="text-gray-600 text-2xl">+</span>
            <div class="flex items-center gap-4">
                <span class="font-bold text-lg text-purple-100">پروتکل VMESS</span>
                <div class="bg-purple-500/20 p-3 rounded-xl text-purple-500"><i class="fas fa-rocket fa-lg"></i></div>
            </div>
        </div>

    </main>

    <footer class="mt-16 w-full max-w-xl">
        <div class="flex justify-center gap-4">
            <a href="https://t.me/your_id" target="_blank" class="social-card p-4 rounded-2xl flex flex-col items-center w-24 border border-blue-500/20">
                <i class="fab fa-telegram text-2xl text-blue-400 mb-2"></i>
                <span class="text-xs">تلگرام</span>
            </a>
            <a href="https://instagram.com/your_id" target="_blank" class="social-card p-4 rounded-2xl flex flex-col items-center w-24 border border-pink-500/20">
                <i class="fab fa-instagram text-2xl text-pink-500 mb-2"></i>
                <span class="text-xs">اینستاگرام</span>
            </a>
            <a href="https://youtube.com/your_id" target="_blank" class="social-card p-4 rounded-2xl flex flex-col items-center w-24 border border-red-500/20">
                <i class="fab fa-youtube text-2xl text-red-500 mb-2"></i>
                <span class="text-xs">یوتیوب</span>
            </a>
        </div>
    </footer>

    <script>
        function copyLink(fileName) {
            // ایجاد لینک خودکار بر اساس مسیر گیت‌هاب شما
            const pathParts = window.location.pathname.split('/').filter(p => p !== "");
            const username = window.location.hostname.split('.')[0];
            const repo = pathParts[0];
            const rawUrl = `https://raw.githubusercontent.com/${username}/${repo}/main/${fileName}`;
            
            navigator.clipboard.writeText(rawUrl).then(() => {
                alert("لینک اشتراک کپی شد. آن را در اپلیکیشن وارد کنید.");
            });
        }
    </script>
</body>
</html>
