<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل هوشمند کانفیگ</title>
    <link rel="icon" type="image/jpeg" href="icon.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
        
        :root {
            --bg-color: #0d1117;
            --text-color: #ffffff;
            --card-bg: rgba(22, 27, 34, 0.8);
            --accent: #3b82f6; /* رنگ آبی اصلی */
        }

        .light-mode {
            --bg-color: #f0f2f5;
            --text-color: #1a1a1a;
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Vazirmatn', sans-serif; 
            transition: 0.4s;
        }

        /* استایل کارت‌های شیشه‌ای */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            /* اضافه کردن ترنزیشن برای نرم شدن افکت */
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- اضافه کردن افکت گلوینگ در حالت هاور --- */
        .glass-card:hover {
            /* ایجاد سایه درخشان آبی */
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6), 
                        0 0 40px rgba(59, 130, 246, 0.3);
            /* کمی روشن‌تر کردن حاشیه */
            border-color: rgba(59, 130, 246, 0.5);
            /* کمی حرکت به بالا برای حس بهتر */
            transform: translateY(-2px);
        }

        /* تنظیم افکت برای حالت لایت مود */
        .light-mode .glass-card:hover {
             box-shadow: 0 0 20px rgba(59, 130, 246, 0.4), 
                         0 0 40px rgba(59, 130, 246, 0.2);
             border-color: rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <header class="max-w-4xl mx-auto flex justify-between items-center mb-12">
        <div class="flex items-center gap-4">
            <img src="icon.jpg" class="w-16 h-16 rounded-2xl shadow-lg border-2 border-blue-500 glow-effect" alt="Logo">
            <div>
                <h1 class="text-2xl font-black">پنل هوشمند کانفیگ</h1>
                <p class="text-gray-400 text-sm">بروزرسانی هر ۲ ساعت</p>
            </div>
        </div>
        <button onclick="toggleTheme()" class="w-12 h-12 glass-card flex items-center justify-center text-xl hover:scale-110">
            <i id="theme-icon" class="fas fa-moon"></i>
        </button>
    </header>

    <main class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <div class="glass-card p-6 col-span-1 md:col-span-2 flex flex-col md:flex-row justify-between items-center gap-6 border-l-4 border-blue-500">
            <div>
                <h2 class="text-xl font-bold mb-2">مجموع کل کانفیگ‌ها</h2>
                <p id="count-all" class="text-4xl font-black text-blue-500">---</p>
            </div>
            <button onclick="copyLink('all_raw.txt')" class="bg-blue-600 hover:bg-blue-700 hover:shadow-[0_0_15px_rgba(59,130,246,0.5)] px-8 py-3 rounded-xl font-bold transition-all flex items-center gap-2">
                <i class="fas fa-copy"></i> کپی ساب‌لینک اصلی
            </button>
        </div>

        <div class="glass-card p-6 flex justify-between items-center">
            <div>
                <p class="text-gray-400">پروتکل VLESS</p>
                <p id="count-vless" class="text-2xl font-bold">--</p>
            </div>
            <button onclick="copyLink('vless_raw.txt')" class="text-blue-400 hover:bg-blue-500/10 p-3 rounded-lg transition-colors"><i class="fas fa-link"></i></button>
        </div>

        <div class="glass-card p-6 flex justify-between items-center">
            <div>
                <p class="text-gray-400">پروتکل VMess</p>
                <p id="count-vmess" class="text-2xl font-bold">--</p>
            </div>
            <button onclick="copyLink('vmess_raw.txt')" class="text-purple-400 hover:bg-purple-500/10 p-3 rounded-lg transition-colors"><i class="fas fa-link"></i></button>
        </div>

        <div class="glass-card p-6 flex justify-between items-center">
            <div>
                <p class="text-gray-400">پروتکل Trojan</p>
                <p id="count-trojan" class="text-2xl font-bold">--</p>
            </div>
            <button onclick="copyLink('trojan_raw.txt')" class="text-red-400 hover:bg-red-500/10 p-3 rounded-lg transition-colors"><i class="fas fa-link"></i></button>
        </div>

        <div class="glass-card p-6 flex justify-between items-center">
            <div>
                <p class="text-gray-400">پروتکل Shadowsocks</p>
                <p id="count-ss" class="text-2xl font-bold">--</p>
            </div>
            <button onclick="copyLink('ss_raw.txt')" class="text-green-400 hover:bg-green-500/10 p-3 rounded-lg transition-colors"><i class="fas fa-link"></i></button>
        </div>
    </main>

    <footer class="mt-16 max-w-4xl mx-auto flex flex-col items-center gap-8 pb-8">
        <div class="glass-card px-6 py-4 flex flex-col items-center gap-3">
            <p class="text-gray-500 text-sm font-bold">تعداد بازدید از این صفحه</p>
            <img src="https://count.getloli.com/get/@smartconfigs_github?theme=rule_734" alt="Visitor Count">
        </div>

        <div class="text-center">
            <p class="text-gray-500 text-sm mb-4">آخرین آپدیت: <span id="last-update" class="text-blue-500">---</span></p>
            <div class="flex gap-8 justify-center">
                <a href="https://t.me/smartconfigs" target="_blank" class="text-gray-400 hover:text-blue-400 text-3xl transition-transform hover:scale-125 hover:drop-shadow-[0_0_10px_rgba(59,130,246,0.8)]"><i class="fab fa-telegram"></i></a>
                <a href="https://github.com/kasesm/Free-Config" target="_blank" class="text-gray-400 hover:text-white text-3xl transition-transform hover:scale-125 hover:drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]"><i class="fab fa-github"></i></a>
            </div>
        </div>
    </footer>

    <script>
        // دریافت داده‌ها از JSON
        fetch('info.json').then(r => r.json()).then(data => {
            const keys = ['all', 'vless', 'vmess', 'trojan', 'ss'];
            keys.forEach(k => {
                const el = document.getElementById(`count-${k}`);
                if(el && data[k] !== undefined) el.innerText = data[k] + " مورد";
            });
            document.getElementById('last-update').innerText = data.last_update;
        });

        // تابع کپی لینک
        function copyLink(fileName) {
            const username = window.location.hostname.split('.')[0];
            const repo = window.location.pathname.split('/')[1] || 'Free-Config';
            const rawUrl = `https://raw.githubusercontent.com/${username}/${repo}/main/${fileName}`;
            
            navigator.clipboard.writeText(rawUrl).then(() => {
                alert("لینک سابلینک با موفقیت کپی شد!");
            });
        }

        // تغییر تم
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            body.classList.toggle('light-mode');
            if(body.classList.contains('light-mode')) {
                icon.classList.replace('fa-moon', 'fa-sun');
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
            }
        }
    </script>
</body>
</html>
