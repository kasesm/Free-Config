<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل کانفیگ رایگان</title>
    <link rel="icon" type="image/jpeg" href="icon.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
        body { background-color: #0d1117; color: white; font-family: 'Vazirmatn', sans-serif; }
        .glass { background: rgba(22, 27, 34, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); transition: 0.3s; }
        .glass:hover { transform: translateY(-5px); border-color: #3b82f6; }
    </style>
</head>
<body class="flex flex-col items-center p-6 min-h-screen">
    
    <header class="text-center mt-10 mb-12">
        <h1 class="text-5xl md:text-7xl font-black bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent pb-4">
            کانفیگ رایگان
        </h1>
        <p class="text-gray-400">آخرین آپدیت: <span id="last-update" class="text-blue-400 font-bold">...</span></p>
    </header>

    <main class="w-full max-w-lg space-y-4">
        <div onclick="copyLink('all_sub.txt')" class="glass rounded-2xl p-6 flex items-center justify-between cursor-pointer border-blue-500/20">
            <span id="count-all" class="text-blue-400 text-xs font-bold bg-blue-500/10 px-2 py-1 rounded-lg">...</span>
            <div class="flex items-center gap-4 font-bold text-lg">کپی لینک اشتراک (ALL) <i class="fas fa-layer-group text-blue-500"></i></div>
        </div>

        <div onclick="copyLink('vless_sub.txt')" class="glass rounded-2xl p-6 flex items-center justify-between cursor-pointer border-green-500/20">
            <span id="count-vless" class="text-green-400 text-xs font-bold bg-green-500/10 px-2 py-1 rounded-lg">...</span>
            <div class="flex items-center gap-4 font-bold text-lg">کپی لینک VLESS <i class="fas fa-shield-halved text-green-500"></i></div>
        </div>
    </main>

    <script>
        fetch('info.json').then(r => r.json()).then(data => {
            document.getElementById('count-all').innerText = data.all + " کانفیگ";
            document.getElementById('count-vless').innerText = data.vless + " کانفیگ";
            document.getElementById('last-update').innerText = data.last_update;
        });

        function copyLink(fileName) {
            // ساخت لینک مستقیم Raw گیت‌هاب برای کپی کردن
            const user = window.location.hostname.split('.')[0];
            const repo = window.location.pathname.split('/')[1];
            const rawUrl = `https://raw.githubusercontent.com/${user}/${repo}/main/${fileName}`;
            
            navigator.clipboard.writeText(rawUrl).then(() => {
                alert("لینک اشتراک کپی شد! حالا این لینک را در برنامه v2rayNG وارد کنید.");
            });
        }
    </script>
</body>
</html>
