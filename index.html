<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کانفیگ رایگان</title>
    <link rel="icon" type="image/jpeg" href="icon.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
        body { background-color: #0d1117; color: white; font-family: 'Vazirmatn', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(22, 27, 34, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); transition: 0.3s; position: relative; overflow: hidden; }
        .glass:hover { transform: translateY(-5px); border-color: rgba(255, 255, 255, 0.2); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .neon-border:hover { filter: drop-shadow(0 0 8px currentColor); }
    </style>
</head>
<body class="flex flex-col items-center p-4 md:p-10 min-h-screen">
    
    <header class="text-center mt-6 mb-12 w-full max-w-2xl px-4">
        <h1 class="text-4xl sm:text-5xl md:text-7xl font-black bg-gradient-to-r from-blue-500 via-purple-400 to-cyan-400 bg-clip-text text-transparent pb-4 leading-tight">
            کانفیگ رایگان
        </h1>
        <div class="flex items-center justify-center gap-3 mt-2 text-xs md:text-sm text-gray-400">
            <span class="relative flex h-3 w-3"><span class="animate-ping absolute h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative h-3 w-3 rounded-full bg-green-500"></span></span>
            بروزرسانی زنده: <span id="last-update" class="text-blue-400 font-bold">...</span>
        </div>
    </header>

    <main class="w-full max-w-xl space-y-4 px-2">
        <div onclick="copyLink('all_sub.txt')" class="glass rounded-2xl p-5 flex items-center justify-between cursor-pointer border-blue-500/20 text-blue-400 neon-border">
            <span id="count-all" class="text-xs bg-blue-500/10 px-3 py-1 rounded-full font-bold">...</span>
            <div class="flex items-center gap-4 font-bold text-white">همه پروتکل‌ها <i class="fas fa-layer-group text-blue-500 text-xl"></i></div>
        </div>

        <div onclick="copyLink('vless_sub.txt')" class="glass rounded-2xl p-5 flex items-center justify-between cursor-pointer border-green-500/20 text-green-400 neon-border">
            <span id="count-vless" class="text-xs bg-green-500/10 px-3 py-1 rounded-full font-bold">...</span>
            <div class="flex items-center gap-4 font-bold text-white text-green-100">پروتکل VLESS <i class="fas fa-shield-halved text-green-500 text-xl"></i></div>
        </div>

        <div onclick="copyLink('vmess_sub.txt')" class="glass rounded-2xl p-5 flex items-center justify-between cursor-pointer border-purple-500/20 text-purple-400 neon-border">
            <span id="count-vmess" class="text-xs bg-purple-500/10 px-3 py-1 rounded-full font-bold">...</span>
            <div class="flex items-center gap-4 font-bold text-white text-purple-100">پروتکل VMESS <i class="fas fa-rocket text-purple-500 text-xl"></i></div>
        </div>

        <div onclick="copyLink('trojan_sub.txt')" class="glass rounded-2xl p-5 flex items-center justify-between cursor-pointer border-red-500/20 text-red-400 neon-border">
            <span id="count-trojan" class="text-xs bg-red-500/10 px-3 py-1 rounded-full font-bold">...</span>
            <div class="flex items-center gap-4 font-bold text-white text-red-100">پروتکل Trojan <i class="fas fa-user-secret text-red-500 text-xl"></i></div>
        </div>

        <div onclick="copyLink('ss_sub.txt')" class="glass rounded-2xl p-5 flex items-center justify-between cursor-pointer border-yellow-500/20 text-yellow-400 neon-border">
            <span id="count-ss" class="text-xs bg-yellow-500/10 px-3 py-1 rounded-full font-bold">...</span>
            <div class="flex items-center gap-4 font-bold text-white text-yellow-100">پروتکل Shadowsocks <i class="fas fa-key text-yellow-500 text-xl"></i></div>
        </div>
    </main>

    <footer class="mt-16 flex gap-8">
        <a href="https://t.me/your_id" class="text-gray-500 hover:text-blue-400 transition-all text-3xl"><i class="fab fa-telegram"></i></a>
        <a href="https://instagram.com/your_id" class="text-gray-500 hover:text-pink-500 transition-all text-3xl"><i class="fab fa-instagram"></i></a>
    </footer>

    <script>
        fetch('info.json').then(r => r.json()).then(data => {
            const keys = ['all', 'vless', 'vmess', 'trojan', 'ss'];
            keys.forEach(k => { if(data[k] !== undefined) document.getElementById(`count-${k}`).innerText = data[k] + " کانفیگ"; });
            document.getElementById('last-update').innerText = data.last_update;
        });

        function copyLink(f) {
            const pathParts = window.location.pathname.split('/').filter(p => p !== "");
            const username = window.location.hostname.split('.')[0];
            const repo = pathParts[0];
            const rawUrl = `https://raw.githubusercontent.com/${username}/${repo}/main/${f}`;
            navigator.clipboard.writeText(rawUrl).then(() => alert("لینک اشتراک کپی شد!"));
        }
    </script>
</body>
</html>
