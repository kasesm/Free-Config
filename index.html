<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل اشتراک رایگان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
        body { background-color: #0d1117; color: white; font-family: 'Vazirmatn', sans-serif; }
        .config-box { background: rgba(22, 27, 34, 0.8); border: 2px solid rgba(59, 130, 246, 0.1); transition: all 0.3s ease; }
        .config-box:hover { border-color: #3b82f6; transform: translateY(-3px); }
        .count-badge { background: rgba(59, 130, 246, 0.2); color: #60a5fa; padding: 2px 8px; border-radius: 8px; font-size: 0.8rem; }
    </style>
</head>
<body class="flex flex-col items-center p-6 min-h-screen">

    <header class="text-center mt-10 mb-12">
        <h1 class="text-5xl font-black mb-4 bg-gradient-to-r from-blue-500 to-cyan-400 bg-clip-text text-transparent">کانفیگ رایگان</h1>
        <p class="text-gray-500">منبع بروزترین اشتراک‌های V2Ray</p>
    </header>

    <main class="w-full max-w-xl space-y-4">
        <div onclick="copyLink('all_sub.txt')" class="config-box rounded-2xl p-5 flex items-center justify-between cursor-pointer">
            <div class="flex items-center gap-2">
                <span id="count-all" class="count-badge">...</span>
            </div>
            <div class="flex items-center gap-4">
                <span class="font-bold">میکس همه کانفیگ‌ها</span>
                <div class="bg-blue-500/20 p-3 rounded-xl text-blue-500"><i class="fas fa-layer-group"></i></div>
            </div>
        </div>

        <div onclick="copyLink('vless_sub.txt')" class="config-box rounded-2xl p-5 flex items-center justify-between cursor-pointer border-green-900/20">
            <div class="flex items-center gap-2">
                <span id="count-vless" class="count-badge">...</span>
            </div>
            <div class="flex items-center gap-4">
                <span class="font-bold text-green-100">پروتکل VLESS</span>
                <div class="bg-green-500/20 p-3 rounded-xl text-green-500"><i class="fas fa-shield-halved"></i></div>
            </div>
        </div>
    </main>

    <footer class="mt-auto py-10 flex gap-4">
        <a href="https://t.me/YOUR_CHANNEL" class="text-gray-400 hover:text-blue-400 text-2xl"><i class="fab fa-telegram"></i></a>
        <a href="https://instagram.com/YOUR_PAGE" class="text-gray-400 hover:text-pink-500 text-2xl"><i class="fab fa-instagram"></i></a>
    </footer>

    <script>
        // لود کردن تعداد کانفیگ‌ها از فایل JSON
        fetch('info.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('count-all').innerText = data.all + " کانفیگ";
                document.getElementById('count-vless').innerText = data.vless + " کانفیگ";
            })
            .catch(() => console.log("Stats not found yet"));

        function copyLink(fileName) {
            const url = `${window.location.origin}${window.location.pathname}${fileName}`;
            const rawUrl = url.replace('github.io', 'githubusercontent.com').replace(window.location.pathname, window.location.pathname + 'main/');
            // نکته: برای سادگی، می‌توانید لینک مستقیم RAW خود را اینجا دستی بنویسید
            navigator.clipboard.writeText(rawUrl);
            alert("کپی شد!");
        }
    </script>
</body>
</html>
