<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Subscription Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0d1117; color: white; font-family: 'Tahoma', sans-serif; }
        .config-box {
            background: rgba(22, 27, 34, 0.8);
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .config-box:hover { border-color: #3b82f6; background: rgba(30, 41, 59, 1); }
        .copy-btn { cursor: pointer; }
    </style>
</head>
<body class="flex flex-col items-center p-8">
    <h1 class="text-2xl font-bold mb-10 flex items-center gap-2">
        <i class="fas fa-link text-blue-500"></i> لینک‌های اشتراک
    </h1>

    <div class="w-full max-w-xl space-y-4">
        
        <div onclick="copyLink('all_sub.txt')" class="config-box rounded-2xl p-5 flex items-center justify-between border-blue-900/50 hover:shadow-[0_0_15px_rgba(59,130,246,0.3)]">
            <span class="text-gray-500 text-xl">+</span>
            <div class="flex items-center gap-3">
                <span class="font-bold">میکس همه کانفیگ‌ها</span>
                <div class="bg-blue-500/20 p-2 rounded-lg text-blue-500"><i class="fas fa-layer-group"></i></div>
            </div>
        </div>

        <div onclick="copyLink('vless_sub.txt')" class="config-box rounded-2xl p-5 flex items-center justify-between border-green-900/50 hover:border-green-500 hover:shadow-[0_0_15px_rgba(16,185,129,0.3)]">
            <span class="text-gray-500 text-xl">+</span>
            <div class="flex items-center gap-3">
                <span class="font-bold text-green-100">فقط پروتکل VLESS</span>
                <div class="bg-green-500/20 p-2 rounded-lg text-green-500"><i class="fas fa-shield-halved"></i></div>
            </div>
        </div>

        <div onclick="copyLink('vmess_sub.txt')" class="config-box rounded-2xl p-5 flex items-center justify-between border-purple-900/50 hover:border-purple-500 hover:shadow-[0_0_15px_rgba(168,85,247,0.3)]">
            <span class="text-gray-500 text-xl">+</span>
            <div class="flex items-center gap-3">
                <span class="font-bold text-purple-100">فقط پروتکل VMESS</span>
                <div class="bg-purple-500/20 p-2 rounded-lg text-purple-500"><i class="fas fa-rocket"></i></div>
            </div>
        </div>

    </div>

    <script>
        function copyLink(fileName) {
            const baseUrl = `https://raw.githubusercontent.com/${window.location.pathname.split('/')[1]}/${window.location.pathname.split('/')[2]}/main/${fileName}`;
            navigator.clipboard.writeText(baseUrl).then(() => {
                alert("لینک اشتراک با موفقیت کپی شد!");
            });
        }
    </script>
</body>
</html>
