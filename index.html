<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل هوشمند کانفیگ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
        body { background-color: #0d1117; color: white; font-family: 'Vazirmatn'; }
        .glass-card { background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; }
    </style>
</head>
<body class="p-6 flex flex-col items-center">

    <header class="mb-10 text-center">
        <h1 class="text-3xl font-black text-blue-500 mb-2">پنل هوشمند کانفیگ</h1>
        <p id="last-update" class="text-gray-500 text-sm">بروزرسانی: در حال بارگذاری...</p>
    </header>

    <main class="w-full max-w-4xl space-y-6">
        <div class="glass-card border-2 border-red-500 p-8 bg-red-500/5">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-black text-red-500"><i class="fas fa-bolt ml-2"></i> منبع ۱۷ هزارتایی (Filter Breaker)</h2>
                <span id="count-hv" class="bg-red-500 px-3 py-1 rounded-full text-sm font-bold">0</span>
            </div>
            <button onclick="copyLink('high_volume_raw.txt')" class="w-full bg-red-600 hover:bg-red-700 py-3 rounded-xl font-bold transition-all">کپی سابلینک سنگین</button>
        </div>

        <div class="glass-card p-6 flex justify-between items-center border-r-4 border-blue-500">
            <div><p class="text-gray-400 text-xs">سابلینک اصلی (شامل کانفیگ‌های ویژه)</p><p id="count-all" class="text-xl font-bold">...</p></div>
            <button onclick="copyLink('all_raw.txt')" class="text-blue-500 text-3xl"><i class="fas fa-copy"></i></button>
        </div>
    </main>

    <script>
        fetch('info.json').then(r => r.json()).then(data => {
            document.getElementById('count-hv').innerText = data.hv_count;
            document.getElementById('count-all').innerText = data.all + " مورد";
            document.getElementById('last-update').innerText = "آخرین بروزرسانی: " + data.last_update;
        });

        function copyLink(f) {
            const user = window.location.hostname.split('.')[0];
            const repo = "Free-Config"; 
            const url = `https://raw.githubusercontent.com/${user}/${repo}/main/${f}`;
            navigator.clipboard.writeText(url).then(() => alert("کپی شد!"));
        }
    </script>
</body>
</html>
